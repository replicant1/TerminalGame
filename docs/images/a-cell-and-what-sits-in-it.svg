<path d="M 137 356 v 7 h 50 v -7" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="162" y="380" font-size="12" fill="#1b1b1b" text-anchor="middle">one cell</text>
<text x="149" y="182" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<line x1="149" y1="186" x2="149" y2="348" stroke="#e8574a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="162" y="404" font-size="12" fill="#5b6472" text-anchor="middle">a wall's line sits in a left character too</text>
<rect x="392" y="261" width="18" height="18" fill="#d2b126"/>
<rect x="444" y="261" width="18" height="18" fill="#d2b126"/>
<rect x="496" y="261" width="18" height="18" fill="#d2b126"/>
<path d="M 441 356 v 7 h 24 v -7" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="453" y="380" font-size="12" fill="#1b1b1b" text-anchor="middle">one character</text>
<text x="453" y="182" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<line x1="453" y1="186" x2="453" y2="348" stroke="#e8574a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="466" y="404" font-size="12" fill="#5b6472" text-anchor="middle">every corridor cell starts with one</text>
<rect x="696" y="261" width="18" height="18" fill="#d2b126"/>
<rect x="800" y="261" width="18" height="18" fill="#d2b126"/>
<rect x="731" y="244" width="52" height="52" fill="#faff35"/>
<path d="M 731 356 v 7 h 52 v -7" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="757" y="380" font-size="12" fill="#1b1b1b" text-anchor="middle">two characters of ink, across three</text>
<text x="757" y="182" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<line x1="757" y1="186" x2="757" y2="348" stroke="#e8574a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="770" y="404" font-size="12" fill="#5b6472" text-anchor="middle">the pill underneath is covered, eaten or not</text>
<rect x="1000" y="261" width="18" height="18" fill="#d2b126"/>
<rect x="1104" y="261" width="18" height="18" fill="#d2b126"/>
<text x="1061" y="182" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<line x1="1061" y1="186" x2="1061" y2="348" stroke="#e8574a" stroke-width="2" stroke-dasharray="4 4"/>
<text x="1074" y="404" font-size="12" fill="#5b6472" text-anchor="middle">one character became a blank</text>
<text x="32" y="456" font-size="18" font-weight="600" fill="#1b1b1b">Why the left character</text>
<text x="32" y="482" font-size="15" fill="#5b6472">A cell is one row tall and two characters wide, which comes out very nearly square, because a terminal's</text>
<text x="32" y="504" font-size="15" fill="#5b6472">character is about twice as tall as it is wide. There is no column between the two halves for a wall's</text>
<text x="32" y="526" font-size="15" fill="#5b6472">vertical line to sit in, so the left character is the centre line every part of the picture has to share:</text>
<text x="32" y="548" font-size="15" fill="#5b6472">the walls draw their lines there, the pill sits there, and a sprite is centred on it.</text>
<text x="32" y="570" font-size="15" fill="#5b6472"></text>
<text x="32" y="592" font-size="15" fill="#5b6472">That is also why sprite art is an odd number of characters wide. Ink centred on a character can be one</text>
<text x="32" y="614" font-size="15" fill="#5b6472">character wide, or three, but never two -- two are centred on the join between them, half a character off</text>
<text x="32" y="636" font-size="15" fill="#5b6472">the line. Three characters give a full corridor's width of ink and still sit centred, at the cost of</text>
<text x="32" y="658" font-size="15" fill="#5b6472">overhanging into the blank right-hand character of the cell alongside.</text>
</svg>
