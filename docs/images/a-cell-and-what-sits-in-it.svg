<text x="310" y="788" font-size="12" fill="#5b6472" text-anchor="middle">one cell down, and the same:</text>
<text x="310" y="804" font-size="12" fill="#5b6472" text-anchor="middle">eating is only seen from behind</text>
<text x="440" y="452" font-size="18" font-weight="600" fill="#1b1b1b">Why the left character</text>
<text x="440" y="486" font-size="15" fill="#5b6472">A cell is one row tall and two characters wide, which comes out very nearly</text>
<text x="440" y="508" font-size="15" fill="#5b6472">square, because a terminal's character is about twice as tall as it is wide.</text>
<text x="440" y="530" font-size="15" fill="#5b6472">There is no column between the two halves for a wall's vertical line to sit in,</text>
<text x="440" y="552" font-size="15" fill="#5b6472">so the left character is the centre line every part of the picture has to</text>
<text x="440" y="574" font-size="15" fill="#5b6472">share: the walls draw their lines there, the pill sits there, and a sprite is</text>
<text x="440" y="596" font-size="15" fill="#5b6472">centred on it. Turning the corridor on its end changes none of that. The pills</text>
<text x="440" y="618" font-size="15" fill="#5b6472">stack up on one column, and the right-hand character of every cell in the run</text>
<text x="440" y="640" font-size="15" fill="#5b6472">stays blank.</text>
<text x="440" y="662" font-size="15" fill="#5b6472"></text>
<text x="440" y="684" font-size="15" fill="#5b6472">That is also why sprite art is an odd number of characters wide. Ink centred on</text>
<text x="440" y="706" font-size="15" fill="#5b6472">a character can be one character wide, or three, but never two -- two are</text>
<text x="440" y="728" font-size="15" fill="#5b6472">centred on the join between them, half a character off the line. Three</text>
<text x="440" y="750" font-size="15" fill="#5b6472">characters give a full corridor's width of ink and still sit centred, at the</text>
<text x="440" y="772" font-size="15" fill="#5b6472">cost of overhanging into the blank right-hand character of the cell alongside.</text>
</svg>
