<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" width="1040" height="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- Hand-maintained SVG. Nothing in this repository regenerates it. -->
<!-- Character positions are drawn to scale: 26 by 52, twice as tall as wide. -->
<rect width="1040" height="530" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="600" fill="#1b1b1b">A cell is two characters wide, and everything sits on the left one</text>
<text x="32" y="78" font-size="16" fill="#5b6472">Character positions drawn to scale. Three cells of corridor, seen four ways.</text>
<text x="32" y="116" font-size="18" font-weight="600" fill="#1b1b1b">1. The grid</text>
<text x="32" y="136" font-size="14" fill="#5b6472">two characters make one cell</text>
<rect x="32" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="58" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="84" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="110" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="136" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="162" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<line x1="32" y1="150" x2="32" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="84" y1="150" x2="84" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="136" y1="150" x2="136" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="188" y1="150" x2="188" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="97" y1="142" x2="97" y2="228" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="97" y="244" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<path d="M 33 210 v 6 h 50 v -6" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<text x="58" y="234" font-size="12" fill="#1b1b1b" text-anchor="middle">one cell</text>
<text x="300" y="116" font-size="18" font-weight="600" fill="#1b1b1b">2. A pill</text>
<text x="300" y="136" font-size="14" fill="#5b6472">one character, in the left half</text>
<rect x="300" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="326" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="352" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="378" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="404" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="430" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<line x1="300" y1="150" x2="300" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="352" y1="150" x2="352" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="404" y1="150" x2="404" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="456" y1="150" x2="456" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="365" y1="142" x2="365" y2="228" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="365" y="244" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<rect x="360" y="171" width="10" height="10" fill="#e0a640"/>
<rect x="308" y="171" width="10" height="10" fill="#e0a640"/>
<rect x="412" y="171" width="10" height="10" fill="#e0a640"/>
<text x="568" y="116" font-size="18" font-weight="600" fill="#1b1b1b">3. The player on it</text>
<text x="568" y="136" font-size="14" fill="#5b6472">three characters of ink, centred</text>
<rect x="568" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="594" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="620" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="646" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="672" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="698" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<line x1="568" y1="150" x2="568" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="620" y1="150" x2="620" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="672" y1="150" x2="672" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="724" y1="150" x2="724" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="633" y1="142" x2="633" y2="228" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="633" y="244" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<rect x="594" y="163" width="26" height="26" fill="#d9b310" opacity="0.35"/>
<rect x="620" y="163" width="26" height="26" fill="#d9b310"/>
<rect x="646" y="163" width="26" height="26" fill="#d9b310" opacity="0.35"/>
<text x="633" y="264" font-size="12" fill="#5b6472" text-anchor="middle">overhangs both ways</text>
<rect x="576" y="171" width="10" height="10" fill="#e0a640"/>
<rect x="680" y="171" width="10" height="10" fill="#e0a640"/>
<text x="836" y="116" font-size="18" font-weight="600" fill="#1b1b1b">4. After moving on</text>
<text x="836" y="136" font-size="14" fill="#5b6472">the pill is gone for good</text>
<rect x="836" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="862" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="888" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="914" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="940" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<rect x="966" y="150" width="26" height="52" fill="#f4f6f9" stroke="#dfe4ec"/>
<line x1="836" y1="150" x2="836" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="888" y1="150" x2="888" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="940" y1="150" x2="940" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="992" y1="150" x2="992" y2="202" stroke="#8493ad" stroke-width="2"/>
<line x1="901" y1="142" x2="901" y2="228" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="901" y="244" font-size="12" fill="#c0392b" text-anchor="middle">centre line</text>
<rect x="844" y="171" width="10" height="10" fill="#e0a640"/>
<rect x="948" y="171" width="10" height="10" fill="#e0a640"/>
<text x="32" y="300" font-size="18" font-weight="600" fill="#1b1b1b">Why the left character</text>
<text x="32" y="326" font-size="15" fill="#5b6472">A cell is one row tall and two characters wide, which comes out very nearly square, because a terminal's</text>
<text x="32" y="348" font-size="15" fill="#5b6472">character is about twice as tall as it is wide. There is no column between the two halves for a wall's</text>
<text x="32" y="370" font-size="15" fill="#5b6472">vertical line to sit in, so the left character is the centre line every part of the picture has to share:</text>
<text x="32" y="392" font-size="15" fill="#5b6472">the walls draw their lines there, the pill sits there, and a sprite is centred on it.</text>
<text x="32" y="414" font-size="15" fill="#5b6472"></text>
<text x="32" y="436" font-size="15" fill="#5b6472">That is also why sprite art is an odd number of characters wide. Ink centred on a character can be one</text>
<text x="32" y="458" font-size="15" fill="#5b6472">character wide, or three, but never two -- two are centred on the join between them, half a character off</text>
<text x="32" y="480" font-size="15" fill="#5b6472">the line. Three characters give a full corridor's width of ink and still sit centred, at the cost of</text>
<text x="32" y="502" font-size="15" fill="#5b6472">overhanging into the blank right-hand character of the cell either side.</text>
</svg>