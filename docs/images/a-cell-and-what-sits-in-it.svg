<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 840" width="1240" height="840" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- Hand-maintained SVG. Nothing in this repository regenerates it. -->
<!-- Character positions are drawn to scale: 26 by 52, twice as tall as wide. -->
<!-- Colours are taken from the running game: a black background, blue for -->
<!-- the walls and for nothing else, gold pills, a bright yellow player. -->
<!-- The grey lines belong to this diagram alone: the grid a cell sits on -->
<!-- is never drawn on screen. -->
<rect width="1240" height="840" fill="#ffffff"/>
<text x="32" y="48" font-size="26" font-weight="600" fill="#1b1b1b">A cell is two characters wide, and everything sits on the left one</text>
<text x="32" y="76" font-size="16" fill="#5b6472">Character positions drawn to scale. Three cells of corridor and the walls that box them in, first running across, then the same three running down.</text>
